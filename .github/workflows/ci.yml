name: CI/CD DevSecOps

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: em-raizes:local # nome dado pelo docker-compose.yml

jobs:
  # ---------- Segurança: barra antes de qualquer build ----------
  gitleaks:
    name: Segredos (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico completo: segredo apagado depois também é pego
      - name: Gitleaks (falsos positivos revisados ficam em .gitleaksignore)
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source=/repo --redact --verbose

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        run: semgrep scan --config p/default --error --metrics=off

  # ---------- Qualidade (já existiam) ----------
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[dev]"
      - run: ruff check backend/src backend/tests
      - run: ruff format --check backend/src backend/tests
      - run: pytest backend -q

  frontend:
    name: Frontend (tipos + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  notebook:
    name: Notebook (executa em modo offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e "./backend[notebook]"
      - run: jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=300 --output /tmp/notebook_ci.ipynb notebooks/Aula09.3_Chat_Guardiao.ipynb

  # ---------- Build, Trivy, stack com compose e push ----------
  docker:
    name: Imagem (build + Trivy + compose)
    needs: [gitleaks, semgrep, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      EM_RAIZES_COMMIT: ${{ github.sha }}
      EM_RAIZES_ADMIN_SENHA: ci-senha-descartavel
      EM_RAIZES_SEGREDO_JWT: ci-segredo-com-tamanho-suficiente-123
      AZURE_OK: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build (docker compose)
        run: docker compose build

      - name: Trivy - vulnerabilidades da imagem (bloqueia HIGH/CRITICAL com correção)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress "$IMAGE"

      - name: Trivy - configuração (Dockerfile, compose e Terraform; informativo)
        run: |
          docker run --rm -v "${{ github.workspace }}:/src" \
            aquasec/trivy:latest config --exit-code 0 --severity CRITICAL,HIGH /src

      - name: Subir a stack com docker compose e testar
        run: |
          docker compose up -d
          for i in $(seq 1 30); do curl -fs http://localhost:8000/api/saude && break; sleep 2; done
          curl -fs http://localhost:8000/api/saude | grep -q "\"commit\":\"${GITHUB_SHA}\""
          curl -fs http://localhost:8000/ | grep -q '<div id="raiz">'
          docker compose logs
          docker compose down

      - name: Login na Azure
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AZURE_OK == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Push para o Azure Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.AZURE_OK == 'true'
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          DEST="${{ vars.ACR_NAME }}.azurecr.io/em-raizes:${GITHUB_SHA}"
          docker tag "$IMAGE" "$DEST"
          docker push "$DEST"

      - name: Login no GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagem no GHCR (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          IMG=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}
          docker tag "$IMAGE" "$IMG"
          docker push "$IMG"

  # ---------- CD: só num push na main e só se TODOS os jobs passaram ----------
  deploy:
    name: Deploy (Azure Container Apps)
    needs: [gitleaks, semgrep, backend, frontend, notebook, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-producao
      cancel-in-progress: false
    env:
      AZURE_OK: ${{ secrets.AZURE_CREDENTIALS != '' }}
    steps:
      - name: Deploy não configurado
        if: env.AZURE_OK != 'true'
        run: echo "::notice::Deploy pulado. Defina o secret AZURE_CREDENTIALS e as variáveis ACR_NAME, RESOURCE_GROUP e CONTAINER_APP."

      - name: Login na Azure
        if: env.AZURE_OK == 'true'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Atualizar o Container App para este commit
        if: env.AZURE_OK == 'true'
        run: |
          az extension add --name containerapp --upgrade --yes --only-show-errors
          az containerapp update \
            --name "${{ vars.CONTAINER_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/em-raizes:${GITHUB_SHA}" -o none
          FQDN=$(az containerapp show \
            --name "${{ vars.CONTAINER_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "APP_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Esperar o site no ar com este commit
        if: env.AZURE_OK == 'true'
        timeout-minutes: 10
        run: |
          for i in $(seq 1 40); do
            no_ar=$(curl -fsS --max-time 30 "$APP_URL/api/saude" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("commit") or "")' || true)
            if [ "$no_ar" = "$GITHUB_SHA" ]; then echo "No ar: $no_ar"; exit 0; fi
            echo "Aguardando o deploy ($i/40). No ar agora: ${no_ar:-sem resposta}"
            sleep 15
          done
          echo "::error::O site não mostrou o commit $GITHUB_SHA a tempo."
          exit 1

      - name: Teste de fumaça no site publicado
        if: env.AZURE_OK == 'true'
        run: |
          curl -fsS "$APP_URL/" | grep -q '<div id="raiz">'
          curl -fsS "$APP_URL/api/info" | python3 -c '
          import json, sys
          info = json.load(sys.stdin)
          assert info["ambiente"] == "producao", info["ambiente"]
          assert info["login_habilitado"], "login desativado: falta EM_RAIZES_ADMIN_SENHA"
          print("ok:", info["nome_app"], info["versao"], "| IA online:", info["ia_online"])
          '
          echo "### MVP no ar: $APP_URL" >> "$GITHUB_STEP_SUMMARY"
