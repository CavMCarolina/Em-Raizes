[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "em-raizes"
version = "0.2.0"
description = "Backend do app do administrador: drone e robô jardineiro (simulados), risco de deslizamento e IA generativa"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "numpy>=1.26",
    "pandas>=2.2",
    "openai>=1.50",
    "python-dotenv>=1.0",
    "pyjwt>=2.8",
    "pywebpush>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6"]
notebook = ["jupyter>=1.0", "ipykernel>=6.29", "nbconvert>=7.16"]

[project.scripts]
em-raizes-api = "em_raizes.api.main:rodar"
em-raizes-chat = "em_raizes.ia.chat_terminal:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
em_raizes = ["ia/conhecimento/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
